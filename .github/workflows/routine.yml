# MANUAL DRY RUN ONLY. The Oracle server (the trading-agent-watch service) is the only engine: it checks deals, stops,
# announcements and news every minute in market hours, sends the daily emails and runs the paper forward test after
# the close. This workflow used to run every 30 minutes as a second engine; that is switched off because two engines
# fight over one Groww login (150 token requests a day, one allowed IP) and a Groww-less runner loses its state when
# the Actions cache is evicted.
#
# What is left: press "Run workflow" to fetch the current deals and print what a check would do, with NO broker login,
# NO Claude call, NO email and NO order (no Groww, Anthropic, Resend or order settings are given to this job). It
# restores and saves no state: every run starts from nothing and leaves nothing behind (there is no cache step).
name: trading-agent manual dry run

on:
  workflow_dispatch:

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Dry run of the check (fetch and diff only)
        env:
          MARKET: ${{ vars.MARKET || 'in' }}
          INVESTORS: ${{ vars.INVESTORS }}
          WATCH_INVESTOR: ${{ vars.WATCH_INVESTOR || 'ASHISH KACHOLIA' }}
          WATCH_SOURCE: ${{ vars.WATCH_SOURCE || 'deals' }}
          PAPER_STARTING_CASH: ${{ vars.PAPER_STARTING_CASH || '500000' }}
        run: python -m trading_agent check --dry-run
