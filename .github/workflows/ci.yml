name: ci
on:
  # master on every push; any other branch through its pull request (so a PR push runs CI once, not twice)
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
concurrency:
  # a newer push to the same pull request cancels the run it replaces; master runs always finish
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The server and the laptop both run 3.15, so that is the only version tested
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt   # dev adds pytest-xdist
      - run: python -m pytest -q -n auto                                # tests spread over the runner's cores
      - run: python -m trading_agent check --demo --dry-run
      - run: python -m trading_agent --market us check --demo --dry-run
